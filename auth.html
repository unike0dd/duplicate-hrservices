<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Gabo Services</title>
  <meta name="description" content="Sign in or create a Gabo Services account to continue to your dashboard.">
  <link rel="icon" href="exec-professionals-meeting.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
  <main class="auth-shell">
    <a class="brand auth-brand" href="index.html" aria-label="Return to Gabo Services home">
      Gabo Services
    </a>

    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-context">
        <p class="kicker">Secure workspace access</p>
        <h1 id="auth-title">Welcome back.</h1>
        <p id="auth-description">
          Sign in to continue to your Gabo Services workspace.
        </p>

        <div class="dashboard-destination" id="dashboard-destination" hidden>
          <span>Your destination</span>
          <strong id="dashboard-name"></strong>
        </div>

        <a class="back-link" href="index.html#plans">
          <span aria-hidden="true">←</span> Back to dashboards
        </a>
      </div>

      <div class="auth-form-wrap">
        <div class="auth-tabs" role="tablist" aria-label="Account access">
          <button class="auth-tab active" id="signin-tab" type="button" role="tab" aria-selected="true" aria-controls="auth-form">
            Sign in
          </button>
          <button class="auth-tab" id="signup-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-form">
            Create account
          </button>
        </div>

        <form id="auth-form">
          <div class="name-field" id="name-field" hidden>
            <label for="full-name">Full name</label>
            <input id="full-name" name="name" type="text" autocomplete="name">
          </div>

          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters">

          <div class="form-options" id="signin-options">
            <label class="checkbox-label">
              <input type="checkbox" name="remember">
              Remember me
            </label>
            <a href="mailto:support@gaboservices.com?subject=Password%20reset">Forgot password?</a>
          </div>

          <button class="button button-gold auth-submit" type="submit">
            <span id="submit-label">Sign in</span>
            <span aria-hidden="true">→</span>
          </button>

          <p class="form-note" id="form-note" aria-live="polite">
            You will continue to your selected dashboard after signing in.
          </p>
        </form>
      </div>
    </section>
  </main>

  <script src="auth.js" defer></script>
</body>
</html>
