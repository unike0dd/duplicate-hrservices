<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Email verification | Gabo Services</title>
  <link rel="stylesheet" href="styles.css?v=1">
  <link rel="stylesheet" href="../adaptive.css?v=1">
</head>
<body>
  <main class="page-shell">
    <section class="confirmation-card" aria-labelledby="action-title">
      <header class="brand-row">
        <a class="brand" href="../">Gabo Services</a>
        <button id="language-toggle" class="language-toggle" type="button" aria-label="Cambiar a español">ES</button>
      </header>

      <div id="status-icon" class="status-icon status-pending" aria-hidden="true">
        <span></span>
      </div>

      <p id="eyebrow" class="eyebrow">SECURE ACCOUNT CONFIRMATION</p>
      <h1 id="action-title">Confirming your email…</h1>
      <p id="action-message" class="message" role="status" aria-live="polite">
        Please keep this page open while we validate your secure verification link.
      </p>

      <div class="actions">
        <a id="continue-link" class="primary-action" href="../auth.html?dashboard=consumer&amp;mode=signin" hidden>
          Continue to Consumer sign in
        </a>
        <a id="retry-link" class="secondary-action" href="../auth.html?dashboard=consumer&amp;mode=signin">
          Return to sign in
        </a>
      </div>

      <p id="security-note" class="security-note">
        Gabo Services will never ask for your password through an email verification link.
      </p>
    </section>
  </main>
  <script type="module" src="script.js?v=1"></script>
  <script src="../adaptive.js?v=1" defer></script>
</body>
</html>
