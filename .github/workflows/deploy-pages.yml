name: Deploy secured static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy secured Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Firebase deployment secret
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${FIREBASE_WEB_API_KEY}" ]]; then
            echo "Missing github-pages environment secret FIREBASE_WEB_API_KEY." >&2
            exit 1
          fi

      - name: Prepare deployment artifact
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        shell: bash
        run: |
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '_site' \
            -exec cp -R {} _site/ \;

          placeholder_count="$(
            grep -ohF '__FIREBASE_WEB_API_KEY__'               _site/auth.js               _site/firebase-client.js |
            wc -l
          )"

          if [[ "${placeholder_count}" -ne 2 ]]; then
            echo "Expected exactly two Firebase API-key placeholders in the deployment sources." >&2
            exit 1
          fi

          perl -0pi -e 's/__FIREBASE_WEB_API_KEY__/$ENV{FIREBASE_WEB_API_KEY}/g'             _site/auth.js             _site/firebase-client.js

          if grep -Fq '__FIREBASE_WEB_API_KEY__' _site/auth.js _site/firebase-client.js; then
            echo "A Firebase API-key placeholder was not replaced." >&2
            exit 1
          fi

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
