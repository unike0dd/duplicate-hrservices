name: Google Cloud OIDC Recognition

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-cloud-oidc-recognition
  cancel-in-progress: false

jobs:
  recognize:
    name: Recognize Primary Platform identity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authenticate to Google Cloud without a key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/397025942439/locations/global/workloadIdentityPools/github-gabo-platform/providers/trusted-repositories
          service_account: github-primary-dev@gabo-service.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Confirm short-lived identity
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          if [[ -z "${GOOGLE_ACCESS_TOKEN}" ]]; then
            echo "Google Cloud did not issue a short-lived credential." >&2
            exit 1
          fi

          echo "PASS: Primary Platform repository identity was recognized by Google Cloud."
          echo "No Google Cloud project role or deployment permission was exercised."
